; DX Student Help queue workers
; Install as root:
;   cp deploy/supervisor-queue.conf /etc/supervisord.d/dx-queue.ini
;   supervisorctl reread && supervisorctl update && supervisorctl start dx-queue:*
;
; Replace CPANELUSER and APPDIR before installing.

[program:dx-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/local/bin/ea-php83 /home/CPANELUSER/APPDIR/artisan queue:work redis --queue=default --sleep=3 --tries=3 --max-time=3600 --backoff=10
directory=/home/CPANELUSER/APPDIR
autostart=true
autorestart=true
; Run as the cPanel user, never as root: a worker writing files as root breaks
; every later deploy and is a privilege escalation waiting to happen.
user=CPANELUSER
numprocs=2
redirect_stderr=true
stdout_logfile=/home/CPANELUSER/APPDIR/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
